<div style="text-align: center; margin-top: 80px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333;">
  <h2 style="font-weight: 500; margin-bottom: 25px;">Hello WorLd</h2>
  
  <div style="margin-bottom: 30px;">
    <input #nameInput type="text" placeholder="Enter your name" 
           style="padding: 10px 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 250px; outline: none;" />
    
    <button (click)="sayHello(nameInput.value)" 
            style="padding: 10px 20px; font-size: 16px; margin-left: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Submit
    </button>
  </div>

  <!-- Styled dynamic feedback window block -->
  @if (apiResponse) {
    <div style="background-color: #e8f5e9; display: inline-block; padding: 15px 30px; border-radius: 8px; border: 1px solid #c8e6c9;">
      <h1 style="color: #2e7d32; margin: 0; font-size: 24px; font-weight: 600;">
        {{ apiResponse }}
      </h1>
    </div>
  }
</div>
